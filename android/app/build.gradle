plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// If `android/key.properties` exists, use it to sign the release build.
// In CI we either point this at a user-supplied keystore via repository
// secrets, or at a CI-generated debug-grade keystore. Locally, the file
// will not exist and we fall back to the Flutter debug keystore so
// `flutter run --release` keeps working.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.lanlink.app"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.lanlink.app"
        // Android 8.0 (Oreo) and up.
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        // Strip resources we don't ship UI for (we use Material 3 English-
        // only strings) to keep the APK small.
        resourceConfigurations += ["en"]
        ndk {
            // Drop x86 entirely — no Android device ships it any more.
            // Keep armeabi-v7a + arm64-v8a (mobile) and x86_64 (emulator).
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Use the release config when present, otherwise fall back to
            // debug signing so `flutter run --release` keeps working locally.
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            // R8 + resource shrinking. Keeps reflection-sensitive plugins
            // (path_provider, shared_preferences, etc.) working via the
            // ProGuard rules in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Per-ABI APK splits — each install only ships native libs for the
    // device's own architecture. The "universal" APK is also produced for
    // sideloading; CI publishes both.
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86_64"
            universalApk true
        }
    }

    bundle {
        language { enableSplit = true }
        density { enableSplit = true }
        abi { enableSplit = true }
    }

    packagingOptions {
        resources {
            excludes += [
                "META-INF/LICENSE*",
                "META-INF/NOTICE*",
                "META-INF/AL2.0",
                "META-INF/LGPL2.1",
                "META-INF/*.kotlin_module",
                "kotlin/**",
                "**/*.proto",
                "DebugProbesKt.bin",
            ]
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
}
