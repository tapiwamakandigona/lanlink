name: lanlink
description: "LanLink — cross-platform LAN file sharing for Windows, macOS, Android, and iOS."
publish_to: 'none'
version: 4.1.0+15

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter


  # HTTP server: every peer hosts its own server so transfers are symmetric.
  shelf: ^1.4.1
  shelf_router: ^1.1.4

  # HTTP client with streaming + multipart support, used by the sender.
  dio: ^5.7.0

  # Storage + filesystem.
  path_provider: ^2.1.5
  path: ^1.9.0
  file_picker: ^11.0.3
  permission_handler: ^13.0.1
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  package_info_plus: ^9.0.1

  # QR code rendering + scanning for instant peer pairing.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.4

  # Misc.
  uuid: ^4.5.1
  provider: ^6.1.2
  pub_semver: ^2.1.4

  # Drag-and-drop file targets on Windows, macOS and Linux desktop.
  desktop_drop: ^0.7.1

  # Unlock 90/120 Hz on Android OEMs that cap Flutter at 60 Hz.
  flutter_displaymode: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  crypto: ^3.0.6
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
