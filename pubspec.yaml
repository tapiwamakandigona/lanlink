name: lanlink
description: "LanLink — cross-platform LAN file sharing for Windows, macOS, Android, and iOS."
publish_to: 'none'
version: 4.0.0+14

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP server: every peer hosts its own server so transfers are symmetric.
  shelf: ^1.4.1
  shelf_router: ^1.1.4

  # HTTP client with streaming + multipart support, used by the sender.
  dio: ^5.7.0

  # LAN networking helpers.
  network_info_plus: ^6.1.1

  # Storage + filesystem.
  path_provider: ^2.1.5
  path: ^1.9.0
  file_picker: ^8.1.4
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.0

  # QR code rendering + scanning for instant peer pairing.
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Misc.
  uuid: ^4.5.1
  crypto: ^3.0.6
  provider: ^6.1.2
  pub_semver: ^2.1.4

  # Drag-and-drop file targets on Windows, macOS and Linux desktop.
  desktop_drop: ^0.4.4

  # Unlock 90/120 Hz on Android OEMs that cap Flutter at 60 Hz.
  flutter_displaymode: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
