name: Keystore backup (temporary)
on: workflow_dispatch
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Bundle and encrypt signing material
        env:
          KS_B64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KS_STORE_PW: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KS_KEY_PW: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir bundle
          printf '%s' "$KS_B64" | base64 -d > bundle/lanlink-release.keystore
          {
            echo "alias=$KS_ALIAS"
            echo "storePassword=$KS_STORE_PW"
            echo "keyPassword=$KS_KEY_PW"
          } > bundle/credentials.properties
          tar cf bundle.tar bundle
          cat > pub.pem <<'PUBKEY'
-----BEGIN PUBLIC KEY-----
MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEApD8Z7a8J/y8XYvJMeQRk
Z6N+4tlek6CjwRG+ujdBUFH7tSoLBNUhaIDrElJfSx16jW15CnODSJXAMeXTP5pv
636Q51b8KgMHn1YNbgiUMcEvfL8LIeZCoEhLBQUESVtZjPrEs+YxK5XXSUMFcx7A
uInDH2Q6a+YlJ421OLLTAV7qbmmnJ9WQQtjiFNibCmknXdlDvwAee2TATFF588dp
SaPknkLGVpU3VCYo+Y7EeCiXiSQmH4kBNbG30ChOTYdS7WmEDgjT4kNzN4n2vO0s
+1uxa0KcSmZBrpAh86dSwa5dZaZgaS0XHp9TDqvS6fM+rIQzFGgCtEIyUDZAJhr6
deNtXWueH6bJvaRwME8ExJ9+P2ogfChpoFZ/hSvNI9e7/UlfGaepCB7kYlJ5XDyT
m4YFBHAL+8VPgwgWofGdM+/yGvS40lVI0hPH5oPcXUoqGINGzd1u47d3HDKthTOc
GeijAp6xw+vqktqyKwesowYc2NZKDcbC5WBEWIcnHRmtG5sUeHRyHutUXsnbfdq6
U2UfUvBmya7ljyy9EMaNoXwPq15lrLlCZ29RaAqmeBrJJjRiwoOUMz0x4vJipKxU
+GS8ZFcRUqSOKDmVOFMr8XqH3IM7xC5NCofSOF36GeUoKrA4m5FySWoiqYaYoLFG
yYOmD38TeuaudesmyiylH0UCAwEAAQ==
-----END PUBLIC KEY-----
PUBKEY
          openssl rand -base64 32 > sym.key
          openssl enc -aes-256-cbc -pbkdf2 -salt -in bundle.tar -out bundle.enc -pass file:sym.key
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -in sym.key -out sym.key.enc
          rm -f sym.key bundle.tar
          rm -rf bundle
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-encrypted
          retention-days: 1
          path: |
            bundle.enc
            sym.key.enc
