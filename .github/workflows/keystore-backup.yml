name: Keystore backup (temporary)
on: workflow_dispatch
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Bundle and encrypt signing material
        env:
          KS_B64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KS_STORE_PW: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KS_KEY_PW: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          PUB_B64: ""
        run: |
          set -euo pipefail
          mkdir bundle
          printf '%s' "$KS_B64" | base64 -d > bundle/lanlink-release.keystore
          {
            echo "alias=$KS_ALIAS"
            echo "storePassword=$KS_STORE_PW"
            echo "keyPassword=$KS_KEY_PW"
          } > bundle/credentials.properties
          tar cf bundle.tar bundle
          printf '%s' "$PUB_B64" | base64 -d > pub.pem
          openssl rand -base64 32 > sym.key
          openssl enc -aes-256-cbc -pbkdf2 -salt -in bundle.tar -out bundle.enc -pass file:sym.key
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -in sym.key -out sym.key.enc
          rm -f sym.key bundle.tar && rm -rf bundle
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-encrypted
          retention-days: 1
          path: |
            bundle.enc
            sym.key.enc
