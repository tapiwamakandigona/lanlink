name: CI

on:
  pull_request:
    branches:
      - main
      - 'devin/**'
  push:
    branches:
      - main
      - 'devin/**'
  workflow_dispatch:

# Pin Flutter to keep CI deterministic. Update both here and in release.yml.
env:
  FLUTTER_VERSION: "3.44.9"
  FLUTTER_CHANNEL: "stable"

jobs:
  analyze-and-test:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test --reporter expanded

  build-android:
    name: Build Android APK (debug + release)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true  # artifact storage quota must never fail CI
        with:
          name: lanlink-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 3

      # Also exercise the release build path so R8/shrinking or manifest
      # regressions surface in CI, not at release time. With no keystore
      # secret present, the gradle config intentionally falls back to
      # debug-signing release builds — fine for prototype installs.
      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true  # artifact storage quota must never fail CI
        with:
          name: lanlink-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3

  build-windows:
    name: Build Windows app
    runs-on: windows-2022  # pin: windows-latest (vs2026 image) breaks Flutter 3.24.5 CMake generator
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip Windows build
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          $dst = "build/lanlink-windows.zip"
          Compress-Archive -Path "$src/*" -DestinationPath $dst -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true  # artifact storage quota must never fail CI
        with:
          name: lanlink-windows
          path: build/lanlink-windows.zip
          if-no-files-found: error
          retention-days: 3

  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Zip macOS .app
        run: |
          mkdir -p build/dist
          cd build/macos/Build/Products/Release
          zip -ry "$GITHUB_WORKSPACE/build/dist/lanlink-macos.zip" lanlink.app

      - name: Upload macOS build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true  # artifact storage quota must never fail CI
        with:
          name: lanlink-macos
          path: build/dist/lanlink-macos.zip
          if-no-files-found: error
          retention-days: 3

  build-ios:
    name: Build iOS app (unsigned)
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned .app
        run: |
          mkdir -p build/dist
          cd build/ios/iphoneos
          zip -ry "$GITHUB_WORKSPACE/build/dist/lanlink-ios-unsigned.zip" Runner.app

      - name: Upload iOS build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        continue-on-error: true  # artifact storage quota must never fail CI
        with:
          name: lanlink-ios-unsigned
          path: build/dist/lanlink-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 3
