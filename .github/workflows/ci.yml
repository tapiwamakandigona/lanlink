name: CI

on:
  pull_request:
    branches:
      - main
      - 'devin/**'
  push:
    branches:
      - main
      - 'devin/**'
  workflow_dispatch:

# Pin Flutter to keep CI deterministic. Update both here and in release.yml.
env:
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_CHANNEL: "stable"

jobs:
  analyze-and-test:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test --reporter expanded

  build-android:
    name: Build Android APK (debug)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lanlink-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows app
    runs-on: windows-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip Windows build
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          $dst = "build/lanlink-windows.zip"
          Compress-Archive -Path "$src/*" -DestinationPath $dst -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: lanlink-windows
          path: build/lanlink-windows.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Zip macOS .app
        run: |
          mkdir -p build/dist
          cd build/macos/Build/Products/Release
          zip -ry "$GITHUB_WORKSPACE/build/dist/lanlink-macos.zip" lanlink.app

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: lanlink-macos
          path: build/dist/lanlink-macos.zip
          if-no-files-found: error

  build-ios:
    name: Build iOS app (unsigned)
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned .app
        run: |
          mkdir -p build/dist
          cd build/ios/iphoneos
          zip -ry "$GITHUB_WORKSPACE/build/dist/lanlink-ios-unsigned.zip" Runner.app

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: lanlink-ios-unsigned
          path: build/dist/lanlink-ios-unsigned.zip
          if-no-files-found: error
