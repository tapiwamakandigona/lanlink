name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_CHANNEL: "stable"

jobs:
  build-android-release:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      # If repo secrets for a real release keystore are present, use them.
      # Otherwise, fall back to a deterministic CI-only keystore so the APK
      # still installs cleanly on Android 8+.
      - name: Resolve signing keystore
        id: keystore
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/lanlink-release.keystore"
          if [ -n "${{ secrets.SIGNING_KEY_BASE64 }}" ]; then
            echo "Using user-supplied release keystore"
            echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
            echo "store_password=${{ secrets.SIGNING_STORE_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "key_password=${{ secrets.SIGNING_KEY_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "key_alias=${{ secrets.SIGNING_KEY_ALIAS }}" >> $GITHUB_OUTPUT
          else
            echo "Using CI-generated debug keystore (no SIGNING_KEY_BASE64 secret)"
            keytool -genkeypair \
              -keystore "$KEYSTORE_PATH" \
              -storepass lanlinkci \
              -keypass lanlinkci \
              -alias lanlink \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=LanLink, OU=Dev, O=LanLink, L=Local, S=Local, C=US"
            echo "store_password=lanlinkci" >> $GITHUB_OUTPUT
            echo "key_password=lanlinkci" >> $GITHUB_OUTPUT
            echo "key_alias=lanlink" >> $GITHUB_OUTPUT
          fi
          echo "keystore_path=$KEYSTORE_PATH" >> $GITHUB_OUTPUT

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=${{ steps.keystore.outputs.keystore_path }}
          storePassword=${{ steps.keystore.outputs.store_password }}
          keyAlias=${{ steps.keystore.outputs.key_alias }}
          keyPassword=${{ steps.keystore.outputs.key_password }}
          EOF

      - name: Pub get
        run: flutter pub get

      - name: Build universal APK + per-ABI splits
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          out=build/app/outputs/flutter-apk
          mv "$out/app-release.apk" "$out/lanlink-${GITHUB_REF_NAME}-universal.apk"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            if [ -f "$out/app-$abi-release.apk" ]; then
              mv "$out/app-$abi-release.apk" "$out/lanlink-${GITHUB_REF_NAME}-$abi.apk"
            fi
          done
          ls -la "$out"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: lanlink-android-release
          path: build/app/outputs/flutter-apk/lanlink-*.apk
          if-no-files-found: error

  build-windows-installer:
    name: Build Windows installer (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Stage release tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/installer | Out-Null
          Copy-Item -Recurse -Force build/windows/x64/runner/Release/* build/installer/

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if (-not $version) { $version = "0.0.0-dev" }
          # NOTE: NSIS resolves relative File/OutFile paths against the
          # directory of the .nsi script, NOT the current working dir.
          # The script lives in build/, so paths here are relative to build/.
          $script = @"
          !define APP_NAME "LanLink"
          !define APP_VERSION "$version"
          OutFile "lanlink-windows-setup.exe"
          InstallDir "`$PROGRAMFILES64\LanLink"
          RequestExecutionLevel admin
          Page directory
          Page instfiles
          UninstPage uninstConfirm
          UninstPage instfiles
          Section "Install"
            SetOutPath "`$INSTDIR"
            File /r "installer\*.*"
            CreateDirectory "`$SMPROGRAMS\LanLink"
            CreateShortCut  "`$SMPROGRAMS\LanLink\LanLink.lnk"  "`$INSTDIR\lanlink.exe"
            CreateShortCut  "`$DESKTOP\LanLink.lnk"             "`$INSTDIR\lanlink.exe"
            WriteUninstaller "`$INSTDIR\Uninstall.exe"
          SectionEnd
          Section "Uninstall"
            Delete "`$SMPROGRAMS\LanLink\LanLink.lnk"
            Delete "`$DESKTOP\LanLink.lnk"
            RMDir  "`$SMPROGRAMS\LanLink"
            RMDir /r "`$INSTDIR"
          SectionEnd
          "@
          Set-Content -Path build/lanlink.nsi -Value $script -Encoding ASCII
          & "C:\Program Files (x86)\NSIS\makensis.exe" build/lanlink.nsi

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: lanlink-windows-installer
          path: build/lanlink-windows-setup.exe
          if-no-files-found: error

  build-macos-release:
    name: Build macOS .dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package .dmg + .zip
        run: |
          set -euo pipefail
          mkdir -p build/dist
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then version="dev"; fi
          src="build/macos/Build/Products/Release"
          (cd "$src" && zip -ry "$GITHUB_WORKSPACE/build/dist/lanlink-macos-${GITHUB_REF_NAME}.zip" lanlink.app)
          hdiutil create \
            -volname "LanLink" \
            -srcfolder "$src/lanlink.app" \
            -ov -format UDZO \
            "build/dist/lanlink-macos-${GITHUB_REF_NAME}.dmg"
          ls -la build/dist

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: lanlink-macos-release
          path: |
            build/dist/lanlink-macos-*.dmg
            build/dist/lanlink-macos-*.zip
          if-no-files-found: error

  build-ios-release:
    name: Build iOS unsigned .ipa
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          mkdir -p build/dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -ry "build/dist/lanlink-ios-${GITHUB_REF_NAME}-unsigned.ipa" Payload
          ls -la build/dist

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: lanlink-ios-release
          path: build/dist/lanlink-ios-*-unsigned.ipa
          if-no-files-found: error

  build-linux-release:
    name: Build Linux (AppImage + tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev file

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Linux release
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release

      - name: Package tar.gz + AppImage
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          [ -n "$VER" ] || VER="0.0.0-dev"
          BUNDLE="build/linux/x64/release/bundle"
          mkdir -p build/dist

          # --- tar.gz ---
          STAGE="LanLink-${VER}-linux-x64"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -r "$BUNDLE"/* "$STAGE"/
          tar czf "build/dist/${STAGE}.tar.gz" "$STAGE"

          # --- AppImage ---
          ICON="ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png"
          rm -rf AppDir && mkdir -p AppDir/usr/bin
          cp -r "$BUNDLE"/* AppDir/usr/bin/
          cp "$ICON" AppDir/lanlink.png
          cat > AppDir/lanlink.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=LanLink
          Comment=Fast local-network file sharing
          Exec=lanlink
          Icon=lanlink
          Categories=Network;FileTransfer;Utility;
          Terminal=false
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          export LD_LIBRARY_PATH="${HERE}/usr/bin/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/lanlink" "$@"
          EOF
          chmod +x AppDir/AppRun
          curl -sL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "build/dist/LanLink-${VER}-x86_64.AppImage"
          ls -la build/dist

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: lanlink-linux-release
          path: |
            build/dist/LanLink-*-x86_64.AppImage
            build/dist/LanLink-*-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-android-release
      - build-windows-installer
      - build-macos-release
      - build-ios-release
      - build-linux-release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/lanlink-android-release/*.apk
            artifacts/lanlink-windows-installer/*.exe
            artifacts/lanlink-macos-release/*.dmg
            artifacts/lanlink-macos-release/*.zip
            artifacts/lanlink-ios-release/*.ipa
            artifacts/lanlink-linux-release/*.AppImage
            artifacts/lanlink-linux-release/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
